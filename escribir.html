<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escribir - Chiflecito</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-logo">CHIFLECITO</div>
        <div class="nav-links">
            <a href="index.html" class="nav-item">Inicio</a>
            <a href="escribir.html" class="nav-item active">Escribir</a>
        </div>
        <div class="nav-auth">
            <a href="login.html" class="login-link logout-btn">Salir</a>
        </div>
    </nav>

    <div class="dashboard-container">
        <main class="main-content">
            <div class="card">
                <h2>Crear Nuevo Post</h2>
                <form id="create-post-form">
                    <div style="margin-bottom: 15px;">
                        <label>Título</label><br>
                        <input type="text" id="title" style="width: 100%; padding: 10px; margin-top: 5px;">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label>Contenido</label><br>
                        <textarea id="content" rows="10" style="width: 100%; padding: 10px; margin-top: 5px;"></textarea>
                    </div>
                    <button type="submit" class="btn-action">Publicar</button>
                </form>
            </div>
        </main>
    </div>

    <script src="supabase.js"></script>
    <script src="auth.js"></script>
    <script src="posts.js"></script>
</body>
</html>
