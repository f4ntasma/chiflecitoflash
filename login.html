<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">    
        <title>Chiflecito Login</title>
        <link rel="stylesheet" href="styles.css">
        <!-- Supabase CDN -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head>
    <body id="login-view">
        <div class="login-container">
        <h1>LOGIN</h1>
        
        <div class="input-group">
            <label for="email">Correo</label>
            <input type="email" id="email" placeholder="chiflecito@gmail.com">
        </div>
        
        <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        
        <button type="submit" class="signIn">Iniciar Sesión</button>
        
        <div class="divider">O</div>
        
        <div class="social-login">
            <div class="social-btn">
                <a href="/dashboard.html">
                <img src="public/icons/Google__G__logo.svg.png" alt="icon"></div>
                </a>
                <a href="/dashboard.html">
                <div class="social-btn"><img src="public/icons/Microsoft__M_logo.png" alt="icon"></div>
                </a>
                <a href="/dashboard.html">
                <div class="social-btn"><img src="public/icons/Facebook__F__logo.png" alt="icon"></div>
                </a>
            </div>
        
        <div class="footer">
            No tienes una cuenta sobrin@? <a href="/registrer.html">Regístrate</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="supabase.js"></script>
    <script src="auth.js"></script>
    </body>
</html>
