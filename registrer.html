<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">    
        <title>Chiflecito Login</title>
        <link rel="stylesheet" href="src/registrer.css">
    </head>
    <body id="login-view">
        <div class="login-container">
        <h1>CREAR CUENTA</h1>

        <form action="/registro" method="POST">
            <div class="input-group">
                <label for="name">Nombre Completo</label>
                <input type="text" id="name" name="name" placeholder="Tu nombre" required>
            </div>

            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="chiflecito@ejemplo.com" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="signIn">REGISTRARSE</button>
        </form>

        <div class="divider">O REGÍSTRATE CON</div>

        <div class="social-login">
            <a href="https://accounts.google.com" class="social-btn">
                <img src="public/icons/Google__G__logo.svg.png" alt="Google">
            </a>
            <a href="https://login.live.com" class="social-btn">
                <img src="public/icons/Microsoft__M_logo.png" alt="Microsoft">
            </a>
            <a href="https://www.facebook.com" class="social-btn">
                <img src="public/icons/Facebook__F__logo.png" alt="Facebook">
            </a>
        </div>

        <div class="footer">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </div>
    </div>
    </body>
</html>
